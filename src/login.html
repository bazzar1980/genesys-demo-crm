<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CX CRM — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',system-ui,sans-serif;background:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{background:#1F2937;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
    .login-logo-mark{width:40px;height:40px;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
    .login-logo-mark svg{width:22px;height:22px}
    .login-logo-text{font-size:20px;font-weight:700;color:#fff;line-height:1.2}
    .login-logo-text span{color:#FF4F1F}
    .login-logo-sub{font-size:12px;color:rgba(255,255,255,.3);margin-top:2px}
    h1{font-size:22px;font-weight:600;color:#fff;margin-bottom:6px}
    .login-sub{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:28px}
    .field{margin-bottom:18px}
    label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
    input{width:100%;padding:11px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
    input::placeholder{color:rgba(255,255,255,.2)}
    input:focus{border-color:#FF4F1F;background:rgba(255,79,31,.08)}
    .btn-login{width:100%;padding:12px;background:#FF4F1F;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:4px}
    .btn-login:hover{background:#FF6B42;transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,79,31,.35)}
    .btn-login:active{transform:none}
    .error{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#FCA5A5;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
    .login-footer{margin-top:24px;text-align:center;font-size:12px;color:rgba(255,255,255,.2)}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-mark">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M52 22 A28 28 0 1 0 52 78 L52 68 A18 18 0 1 1 52 32 Z" fill="white"/><line x1="58" y1="24" x2="88" y2="78" stroke="white" stroke-width="13" stroke-linecap="round"/><line x1="88" y1="24" x2="58" y2="78" stroke="white" stroke-width="13" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="login-logo-text">CX <span>CRM</span></div>
        <div class="login-logo-sub">Customer Experience</div>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p class="login-sub">Sign in to your CRM account</p>
    <div class="error" id="errorMsg"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"/>
    </div>
    <button class="btn-login" id="loginBtn">Sign In</button>
    <div class="login-footer">Default credentials: admin / admin &nbsp;·&nbsp; agent / agent</div>
  </div>
  <script>
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      if (!username || !password) { errEl.textContent = 'Please enter username and password'; errEl.style.display = ''; return; }
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Signing in…'; btn.disabled = true;
      try {
        const r = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) });
        const data = await r.json();
        if (!r.ok) { errEl.textContent = data.error || 'Login failed'; errEl.style.display = ''; btn.textContent = 'Sign In'; btn.disabled = false; return; }
        window.location.href = '/';
      } catch(e) { errEl.textContent = 'Connection error'; errEl.style.display = ''; btn.textContent = 'Sign In'; btn.disabled = false; }
    }
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
    document.getElementById('username').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('password').focus(); });
  </script>
</body>
</html>
